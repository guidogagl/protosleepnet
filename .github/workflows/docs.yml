name: docs

# Build the Sphinx site and deploy it to GitHub Pages.
# Uses the modern Pages artifact flow (configure-pages -> upload-pages-artifact
# -> deploy-pages), so there is no gh-pages branch and Jekyll never runs.
# The build is import-free (sphinx-autoapi parses the source statically), so the
# job installs only the light "[docs]" extra — no torch / physioex.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Import-free build: install ONLY the doc tools (no "-e ." → no physioex/torch).
      - run: pip install -r docs/requirements.txt
      # Strict: fail on any warning, but report them all.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
