[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protosleepnet"
version = "1.0.0"
description = "Prototype-based interpretable sleep staging — experiment pipeline for the ProtoSleepNet paper (npj Digital Medicine)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guido Gagliardi", email = "guido.gagliardi@kuleuven.be" }]
keywords = ["sleep-staging", "interpretability", "prototypes", "EEG", "physioex"]

# The model, data loaders, preprocessing, splits, seeds and metrics come from physioex.
dependencies = [
    "physioex==2.0.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# Only needed to (re)generate the interactive explainability demo bundle
# (src/protosleepnet/demo). The demo itself is a static app and needs none of this.
demo = ["umap-learn", "pacmap"]

# Build the documentation site. Import-free: sphinx-autoapi parses the source
# statically, so this pulls NO torch / physioex — the GitHub-Pages CI stays light.
docs = [
    "sphinx==8.1.3",
    "pydata-sphinx-theme==0.16.1",
    "myst-parser>=4,<5",
    "sphinx-autoapi>=3.3,<4",
    "sphinx-design==0.6.1",
    "sphinx-copybutton==0.5.2",
    "sphinxcontrib-mermaid==1.0.0",
]

[project.urls]
Homepage = "https://github.com/guidogagl/protosleepnet"
Documentation = "https://guidogagl.github.io/protosleepnet"
"Paper" = "https://www.nature.com/npjdigitalmed/"
"physioex" = "https://github.com/guidogagl/physioex"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: tests that hit the network (HuggingFace); run with --runslow"]
testpaths = ["tests"]
